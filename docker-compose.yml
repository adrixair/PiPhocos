services:
  piphocos:
    container_name: piphocos
    image: piphocos:latest
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    ports:
      - "${PIPHOCOS_HTTP_BIND:-127.0.0.1}:5000:5000"
    volumes:
      - ./data:/data
    devices:
      - ${PIPHOCOS_SERIAL_PORT:-/dev/ttyUSB0}:${PIPHOCOS_SERIAL_PORT:-/dev/ttyUSB0}
