name: Controle qualite Python

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Preparer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Controler avec flake8
        run: |
          # arreter le build en cas d'erreurs de syntaxe ou de noms indefinis
          flake8 . --count --select=E9,F63,F7,F82 --exclude=site/lib --show-source --statistics
          # exit-zero traite les autres erreurs comme des avertissements
          flake8 . --count --exit-zero --exclude=site/lib --max-complexity=10 --max-line-length=127 --statistics
